health:
  L_slo: 5.0        # ms, latency SLO
  U_max: 0.85       # utilisation considered saturated
  C_target: 0.40    # reliability target
  w_L: 0.50
  w_U: 0.25
  w_C: 0.25
  rho_max: 3.0      # severe if windowed p95 latency >= rho_max * L_slo
  U_crit: 0.95      # severe if utilisation >= this
  C_min: 0.10       ## severe if reliability <= this
  Z_switch: 0.45
  Z_recover: 0.20

switching:
  N_w: 3            # consecutive bad samples needed to switch (debounce)
  N_rec: 3          # consecutive good probes needed to recover
  D: 10.0           # minimum dwell time after any transition (s)
  T_rec: 60.0       # max time allowed for a recovery attempt (s)

runtime:
  rate_hz: 20             # request rate of the replayed stream
  dt: 0.5                 # controller sampling period (s)
  tau_w: 5.0              # window for latency / reliability statistics (s)
  T_hb: 1.0               # heartbeat timeout (s)
  T_req: 0.1              # per-request timeout (s)
  restart_cooldown: 5.0   # min time between restarts of a worker (s)
  wd_consecutive: 3       # consecutive request timeouts => inference watchdog fires

